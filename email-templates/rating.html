<!--
  EmailJS "Portfolio Rating" template.
  Create a NEW template in EmailJS, paste this into Content → "Edit Content" → code view (<>),
  then put its template ID in EMAILJS_RATING_TEMPLATE_ID in src/components/FeedbackContactSection.tsx.
  Variables sent by the rating widget:
    {{rating}}       e.g. "5 out of 5 (Excellent)"
    {{stars_label}}  e.g. "★★★★☆"
    {{comment}}      visitor's comment, or "(no comment left)"
    {{subject}}      e.g. "[Portfolio Rating] 5 out of 5 - Excellent"
  Email clients strip <style> blocks and CSS variables, so everything is inline.
-->
<div style="margin:0;padding:0;background-color:#f0efe9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0efe9;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1f1f1f;padding:28px 32px;border-bottom:4px solid #FFDD00;">
              <p style="margin:0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#FFDD00;font-weight:600;">Portfolio Rating</p>
              <h1 style="margin:8px 0 0;font-size:22px;line-height:1.3;color:#f8f7f9;font-weight:600;">Someone just rated your portfolio</h1>
            </td>
          </tr>

          <!-- Score -->
          <tr>
            <td align="center" style="padding:32px 32px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#1f1f1f;border-radius:10px;">
                <tr>
                  <td align="center" style="padding:18px 32px;">
                    <p style="margin:0;font-size:34px;line-height:1.2;letter-spacing:6px;color:#FFDD00;">{{stars_label}}</p>
                    <p style="margin:8px 0 0;font-size:15px;color:#f8f7f9;font-weight:600;">{{rating}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Comment -->
          <tr>
            <td style="padding:24px 32px 32px;">
              <p style="margin:0 0 10px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#6b6b6b;font-weight:600;">Visitor's comment</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#f8f7f9;border-left:4px solid #FFDD00;border-radius:6px;padding:20px 22px;font-size:15px;line-height:1.7;color:#1a1a1a;white-space:pre-wrap;text-align:left;">{{comment}}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#1f1f1f;padding:22px 32px;text-align:center;">
              <p style="margin:0 0 6px;font-size:13px;color:#f8f7f9;">
                Ratings are <strong style="color:#FFDD00;">anonymous</strong>, so there's no one to reply to.
              </p>
              <p style="margin:0;font-size:12px;color:#f8f7f9;opacity:0.6;">
                Sent from the rating widget on
                <a href="https://www.samuelsianamate.com/" style="color:#FFDD00;text-decoration:none;">samuelsianamate.com</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
